name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_ENV: test

jobs:
  ci:
    name: Lint · Types · Tests · Build · E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias (lockfile)
        run: npm ci

      - name: Generar artefactos de versión
        run: node scripts/gen-version.mjs

      - name: Verificar tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests unitarios
        run: npm run test

      - name: Construir (web + api)
        run: npm run build --workspace=apps/api && npm run build --workspace=apps/web

      - name: Instalar navegadores Playwright
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Tests E2E
        run: npm run test:e2e

      - name: Revisar dependencias (audit)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Subir reporte Playwright (si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
